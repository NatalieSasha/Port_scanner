<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natalie OS - Desktop</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        .system-logo {
        width: 40px;
        height: 40px;
        image-rendering: pixelated;
        margin-bottom: 10px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    .start-icon {
        width: 24px;
        height: 24px;
        margin-right: 10px;
        vertical-align: middle;
        image-rendering: pixelated;
    }
    
    /* Small tweak to make the start button fit the logo */
    .start-btn {
        display: flex;
        align-items: center;
        background: #f5d0fe;
        border: none;
        padding: 5px 15px;
        border-radius: 10px;
        font-weight: 800;
        color: #7c3aed;
        cursor: pointer;
    }
        :root {
            --taskbar-bg: rgba(147, 51, 234, 0.85);
            --icon-label: white;
            --glass-bg: rgba(255, 255, 255, 0.15);
        }

        body {
            background: url("{{ url_for('static', filename='bg.png') }}") no-repeat center center fixed;
            background-size: cover;
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ✨ DESKTOP AREA */
        .desktop {
            flex: 1;
            padding: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 130px);
            grid-template-rows: repeat(auto-fill, 140px);
            gap: 20px;
            align-content: start;
        }

        /* ✨ ICON STYLING */
        .shortcut {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--icon-label);
            transition: all 0.2s ease;
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
        }

        .shortcut:hover {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            transform: translateY(-5px);
        }

        .shortcut img {
            width: 70px; 
            height: 70px;
            margin-bottom: 8px;
            image-rendering: pixelated; /* Keeps your pixel art sharp! */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .shortcut:hover img {
            transform: scale(1.1) rotate(5deg);
        }

        .label {
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }

        /* ✨ SYSTEM WIDGET */
        .widget {
            position: absolute;
            top: 30px;
            right: 30px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 20px;
            border-radius: 16px;
            color: white;
            width: 200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #4ade80;
        }

        /* ✨ TASKBAR */
        .taskbar {
            height: 55px;
            background: var(--taskbar-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            padding: 0 25px;
            box-sizing: border-box;
        }

        .start-btn {
            background: #f5d0fe;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 800;
            color: #7c3aed;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="desktop">
        <!-- Shortcut 1: Cat Scanner -->
        <a href="/scanner" class="shortcut">
            <img src="{{ url_for('static', filename='pixel_icon_magnifying_glass-removebg-preview.png') }}" alt="Scanner">
         <div class="label">Port Scanner</div>
        </a>

        <!-- Shortcut 2: Password Tool -->
        <a href="/password" class="shortcut">
            <img src="{{ url_for('static', filename='pixel_icon_passwords_2-removebg-preview.png') }}" alt="Passwords">
            <div class="label">Pass Check</div>
        </a>
        <a href="/web" class="shortcut">
            <img src="{{ url_for('static', filename='download__3_-removebg-preview.png') }}" alt="Web Security">
            <div class="label">Web Security</div>
        </a>

        <!-- Shortcut 3: Lab Notes -->
        <div class="shortcut" style="opacity: 0.5; cursor: default;">
            <div style="font-size: 55px; margin-bottom: 5px;">📓</div>
            <div class="label">Lab Notes</div>
        </div>

    </div>

    <!-- System Widget -->
    <div class="widget">
        <div style="font-size: 10px; text-transform: uppercase; opacity: 0.7; margin-bottom: 5px;">Cyber Lab Terminal</div>
        <div style="font-weight: 700; font-size: 16px; margin-bottom: 12px;">
            <span class="status-dot"></span> Natalie OS
        </div>
        <div style="font-size: 13px; line-height: 1.6;">
            <span style="opacity: 0.7;">User:</span> Admin_Nat<br>
            <span style="opacity: 0.7;">Network:</span> Secure 🛡️<br>
            <span style="opacity: 0.7;">System:</span> v1.0.4
        </div>
    </div>

    <div class="taskbar">
        <button class="start-btn">Natalie OS</button>
    </div>

</body>
</html>
